<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tokens — LLM Explained</title>
  <link rel="stylesheet" href="../fonts/fonts.css?v=9">
  <link rel="stylesheet" href="level1.css?v=9">
</head>
<body>
  <section class="intro" id="intro" aria-live="polite" hidden></section>

  <header class="bar">
    <div class="where">
      <h1>Tokens</h1>
      <p>Level 1</p>
    </div>
    <div class="counter" aria-live="polite">
      <span class="count" id="count">202</span>
      <span class="unit" id="unit">lines</span>
    </div>
  </header>

  <main class="village" id="village" aria-label="The village text"></main>

  <section class="panel" aria-live="polite">
    <div class="task" id="task"></div>
    <div class="vocab">
      <p class="vocab-label" id="vocab-label">Starting pieces: 25</p>
      <div class="vocab-strip" id="vocab-strip"></div>
    </div>
  </section>

  <script type="module" src="level1.js?v=9"></script>
</body>
</html>
